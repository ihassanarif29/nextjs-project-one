<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" rx="30" fill="#111111"/>

  <!-- Glow -->
  <circle cx="300" cy="200" r="140" fill="#F7DF1E" opacity="0.15"/>

  <!-- Main Card -->
  <rect x="180" y="80" width="240" height="240" rx="20" fill="#F7DF1E"/>

  <!-- JS Text -->
  <text 
    x="300" 
    y="230" 
    font-family="Arial, sans-serif" 
    font-size="110" 
    font-weight="bold" 
    fill="#111111"
    text-anchor="middle">
    JS
  </text>

  <!-- Decorative Code Symbols -->
  <text 
    x="120" 
    y="210" 
    font-family="monospace" 
    font-size="70" 
    fill="#F7DF1E">
    {
  </text>

  <text 
    x="460" 
    y="210" 
    font-family="monospace" 
    font-size="70" 
    fill="#F7DF1E">
    }
  </text>

  <!-- Bottom Text -->
  <text 
    x="300" 
    y="360" 
    font-family="Arial, sans-serif" 
    font-size="28" 
    fill="white"
    text-anchor="middle">
    JavaScript Development
  </text>
</svg>